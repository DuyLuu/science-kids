# XcodeGen spec: the single source of ScienceKids.xcodeproj (not in git).
# Regenerate with ./bootstrap.sh after editing this file.
name: ScienceKids

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  SKKit:
    path: Packages/SKKit

targets:
  ScienceKids:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScienceKids
        excludes:
          - "Resources/Fonts/**"
      # One folder reference per font family keeps each OFL.txt next to its font
      # without a name clash in the bundle (Phudu/OFL.txt, BeVietnamPro/OFL.txt).
      - path: ScienceKids/Resources/Fonts/Phudu
        type: folder
        buildPhase: resources
      - path: ScienceKids/Resources/Fonts/BeVietnamPro
        type: folder
        buildPhase: resources
      # SK-011: lesson content for the trial build, read in place from the content schema
      # fixtures (no copy in apps/ios). In the bundle as `valid/…` (BundledContent.folderName).
      # SK-016: only used when the pack below is missing (no audio then).
      - path: ../../packages/content-schema/fixtures/valid
        type: folder
        buildPhase: resources
      # SK-012: scoring and XP parameters, read in place from content/rules.json (B5.3: one
      # source). In the bundle as `rules.json`. SK-016: the pack manifest's `rules` win when the
      # pack is embedded; this file serves the fixtures fallback.
      - path: ../../content/rules.json
        buildPhase: resources
    # SK-016: the content pack of content-cli (SK-015) goes into the bundle as `pack/` by a script,
    # not a folder reference, because the pack is not in git: a missing folder would break the
    # build. Without the pack the script prints a build warning and the app runs on the fixtures.
    postBuildScripts:
      - name: Embed content pack
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/embed-content-pack.sh
          - $(SK_CONTENT_PACK_DIR)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/pack
        script: |
          sh "${SRCROOT}/scripts/embed-content-pack.sh"
    dependencies:
      - package: SKKit
        product: DesignSystem
      - package: SKKit
        product: ContentModel
      - package: SKKit
        product: LessonEngine
      - package: SKKit
        product: ContentKit
      - package: SKKit
        product: LessonPlayer
      - package: SKKit
        product: AudioKit
      - package: SKKit
        product: Profiles
      - package: SKKit
        product: Sync
    settings:
      base:
        PRODUCT_NAME: ScienceKids
        PRODUCT_BUNDLE_IDENTIFIER: $(SK_BUNDLE_ID)
        INFOPLIST_FILE: ScienceKids/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # No app icon until SK-020 (XcodeGen's preset expects one named AppIcon).
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # SK-016: the content pack to embed (`content-cli build --out`). Override on the command
        # line to try another pack, or a missing one: `xcodebuild … SK_CONTENT_PACK_DIR=/nowhere`.
        SK_CONTENT_PACK_DIR: $(SRCROOT)/../../content/.build/pack

  # SK-008: gallery checks on the simulator (accessibility audit, touch targets, Reduce Motion).
  # SK-011: Welcome → Profile → Home → Topic flow, saved profile, touch targets, EN interface.
  ScienceKidsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScienceKidsUITests
    dependencies:
      - target: ScienceKids
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SK_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScienceKids

  ScienceKidsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScienceKidsTests
    dependencies:
      - target: ScienceKids
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SK_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ScienceKids:
    build:
      targets:
        ScienceKids: all
    run:
      config: Debug
    test:
      config: Debug
      # App unit tests, the UI tests (gallery SK-008, onboarding SK-011, lesson SK-012, voice SK-016,
      # sync SK-022: SyncUITests writes test data to the build's Supabase) and the eight SKKit test
      # targets, in one `xcodebuild test`. Unit tests only: add -skip-testing:ScienceKidsUITests.
      targets:
        - ScienceKidsTests
        - ScienceKidsUITests
        - package: SKKit/DesignSystemTests
        - package: SKKit/ContentModelTests
        - package: SKKit/LessonEngineTests
        - package: SKKit/ContentKitTests
        - package: SKKit/LessonPlayerTests
        - package: SKKit/AudioKitTests
        - package: SKKit/ProfilesTests
        - package: SKKit/SyncTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
