<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Phudu:wght@500;700;900&amp;family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A93A27}a:hover{color:#1E1B18}
@keyframes eLay { from { opacity: 0; translate: 0 -12px; scale: 1.03; } to { opacity: 1; translate: 0 0; scale: 1; } }
@keyframes eRise { from { translate: 0 105%; } to { translate: 0 0; } }
@keyframes eStamp { 0% { opacity: 0; scale: 1.7; } 55% { opacity: 1; scale: 0.9; } 78% { scale: 1.06; } 100% { opacity: 1; scale: 1; } }
@keyframes ePop { 0% { opacity: 0; scale: 0.4; } 70% { opacity: 1; scale: 1.12; } 100% { opacity: 1; scale: 1; } }
@keyframes eFall { 0% { opacity: 0; translate: 0 -70px; rotate: -50deg; } 15% { opacity: 1; } 100% { opacity: 1; translate: 0 0; rotate: 0deg; } }
@keyframes eSlide { from { opacity: 0; translate: 28px 0; } to { opacity: 1; translate: 0 0; } }
@keyframes eGrow { from { scale: 1 0; } to { scale: 1 1; } }
@keyframes eSway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }
@keyframes eNudge { 0%, 100% { translate: 0 0; } 20% { translate: 0 -5px; } 40% { translate: 0 0; } }
.e-lay { animation: eLay 460ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-rise { animation: eRise 440ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-stamp { animation: eStamp 520ms cubic-bezier(.3, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-pop { animation: ePop 380ms cubic-bezier(.3, .7, .3, 1.2) backwards; animation-delay: var(--d, 0ms); }
.e-fall { animation: eFall 950ms cubic-bezier(.2, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-slide { animation: eSlide 360ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-grow { animation: eGrow 620ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); transform-origin: 50% 100%; }
.e-sway { animation: eSway 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
.e-nudge { animation: eNudge 2.8s ease-in-out 1.2s infinite; }
.e-svg { transform-box: fill-box; transform-origin: 50% 50%; }
.e-press { transition: translate 120ms ease, box-shadow 160ms ease, background-color 160ms ease; }
.e-press:active { translate: 0 3px; }
.e-flip { transition: rotate 560ms cubic-bezier(.3, .7, .3, 1), translate 120ms ease; transform-style: preserve-3d; }
@media (prefers-reduced-motion: reduce) {
  .e-lay, .e-rise, .e-stamp, .e-pop, .e-fall, .e-slide, .e-grow, .e-sway, .e-nudge { animation: none !important; }
  .e-press, .e-flip { transition: none !important; }
}
</style>
</helmet>

  <div style="position: relative; z-index: 1; height: 844px; box-sizing: border-box; padding: 18px 20px 22px 20px; display: flex; flex-direction: column; gap: 12px">

    <div role="group" aria-label="Đúng hay sai" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 5px 6px 0; flex-shrink: 0">

            <sc-if value="{{yes.seal}}"><span aria-hidden="true" class="e-stamp" style="--d: 100ms; position: absolute; right: -8px; top: -12px; width: 54px; height: 54px; transform: rotate(-8deg); border-radius: 4px; background: #3F7A33; box-shadow: 0 2px 3px rgba(91, 59, 23, 0.3); display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M3.5 12.5l2.4-2.4 3.9 3.9 8.3-8.3 2.4 2.4L9.8 18.8z" fill="#FBF6EA"></path></svg></span></sc-if>
          </button>
        </span>
        <span style="display: block; filter: {{no.drop}}">
          <button onClick="{{no.tap}}" aria-label="Sai" aria-pressed="{{no.pressed}}" aria-disabled="{{no.off}}" class="e-lay e-press" style="--d: {{no.d}}; position: relative; display: flex; width: 100%; height: 168px; box-sizing: border-box; border: none; border-radius: 20px; cursor: pointer; padding: 0; align-items: center; justify-content: center; {{no.style}}">
            <span class="e-nudge" style="display: block; width: 132px; height: 132px; animation-name: {{no.nudge}}; {{no.pic}}">
              <sc-if value="{{set1}}"><svg width="132" height="132" viewBox="0 0 120 120" aria-hidden="true"><use href="#ic-shake"></use></svg></sc-if>
              <sc-if value="{{set2}}"><svg width="132" height="132" viewBox="0 0 120 120" aria-hidden="true"><use href="#ic-down"></use></svg></sc-if>
            </span>
            <sc-if value="{{no.peel}}"><span aria-hidden="true" class="e-pop" style="position: absolute; top: 0; right: 0; width: 64px; height: 64px; background: #C9B993; clip-path: polygon(0 0, 0 100%, 100% 100%)"></span></sc-if>
            <sc-if value="{{no.retry}}"><span aria-hidden="true" class="e-pop" style="--d: 140ms; position: absolute; top: 32px; right: 32px; width: 28px; height: 28px"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 8.4A7 7 0 1 1 5 13" fill="none" stroke="#1E1B18" stroke-width="2.8" stroke-linecap="round"></path><path d="M3.2 4.2v6.6h6.6z" fill="#1E1B18"></path></svg></span></sc-if>
            <sc-if value="{{no.seal}}"><span aria-hidden="true" class="e-stamp" style="--d: 100ms; position: absolute; right: -8px; top: -12px; width: 54px; height: 54px; transform: rotate(-8deg); border-radius: 4px; background: #3F7A33; box-shadow: 0 2px 3px rgba(91, 59, 23, 0.3); display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M3.5 12.5l2.4-2.4 3.9 3.9 8.3-8.3 2.4 2.4L9.8 18.8z" fill="#FBF6EA"></path></svg></span></sc-if>
          </button>
        </span>
    </div>

    <div style="flex: 1"></div>
    <div style="height: 84px; flex-shrink: 0">
      <sc-if value="{{done}}">
        <div class="e-rise" style="--d: 160ms">
          <a href="Explorer-Reward.dc.html" aria-label="Xem phần thưởng" class="e-nudge e-press" style="position: relative; display: block; height: 84px"><svg width="100%" height="100%" viewBox="0 0 350 84" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0"><g filter="url(#paperE)"><rect x="4" y="10" width="342" height="70" rx="20" fill="#6E2216"></rect></g><g filter="url(#paperE)"><rect x="4" y="3" width="342" height="70" rx="20" fill="#A93A27"></rect></g></svg><span aria-hidden="true" style="position: relative; display: flex; align-items: center; justify-content: center; height: 76px"><svg width="48" height="48" viewBox="0 0 24 24"><path d="M4 10.5h10.2l-4.1-4.1 2.1-2.1L20 12l-7.8 7.7-2.1-2.1 4.1-4.1H4z" fill="#FBF6EA"></path></svg></span></a>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icons":{"editor":"enum","options":["1 · gật / lắc đầu","2 · ngón cái"],"default":"1 · gật / lắc đầu"},"state":{"editor":"enum","options":["hướng dẫn lần đầu","đang đọc câu","vừa chạm: đọc tên","đúng","sai lần 1: gợi ý","đúng ở lần 2"],"default":"hướng dẫn lần đầu"},"showVi":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p: null };
  }
  renderVals() {
    const SETS = {
      '1 · gật / lắc đầu': { n: 1, intro: ['True? Tap the nod. Not true? Tap the shake.', 'Đúng thì chạm bạn gật đầu, sai thì chạm bạn lắc đầu.'] },
      '2 · ngón cái': { n: 2, intro: ['True? Thumb up. Not true? Thumb down.', 'Đúng thì chạm ngón cái lên, sai thì chạm ngón cái xuống.'] }
    };
    const set = SETS[this.props.icons] || SETS['1 · gật / lắc đầu'];
    // Tweak "state" đặt màn về một trạng thái; chạm trên bảng thì chơi tiếp từ trạng thái đó.
    const PRESETS = {
      'hướng dẫn lần đầu': { intro: true, tries: [], pending: null },
      'đang đọc câu': { intro: false, tries: [], pending: null },
      'vừa chạm: đọc tên': { intro: false, tries: [], pending: 'yes' },
      'đúng': { intro: false, tries: ['yes'], pending: null },
      'sai lần 1: gợi ý': { intro: false, tries: ['no'], pending: null },
      'đúng ở lần 2': { intro: false, tries: ['no', 'yes'], pending: null }
    };
    const key = (this.props.state in PRESETS ? this.props.state : 'hướng dẫn lần đầu') + '|' + set.n;
    const s = this.state.p === key ? this.state : { ...PRESETS[key.split('|')[0]], again: false };
    const go = (next) => this.setState({ intro: s.intro, tries: s.tries, pending: s.pending, again: false, ...next, p: key });
    const ANS = 'yes';
    const NAMES = { yes: ['True.', 'Đúng.'], no: ['Not true.', 'Sai.'] };
    const last = s.tries.length ? s.tries[s.tries.length - 1] : null;
    // Hai lựa chọn, max_tries 2: sai lần 1 thì lần 2 chỉ còn một thẻ, nên không có trạng thái "hết lượt".
    const done = s.tries.includes(ANS) || s.tries.length >= 2;
    const right = done && last === ANS;
    const retry = !done && s.tries.length === 1;
    let msg = ['A penguin is a bird.', 'Chim cánh cụt là một loài chim.'], mood = 'talk', talking = true;
    if (s.intro && !s.pending && !s.tries.length) msg = set.intro;
    if (s.pending) msg = NAMES[s.pending];
    else if (right) { msg = ['Yes! Penguins have feathers.', 'Đúng rồi! Cánh cụt có lông vũ và mỏ.']; mood = 'happy'; talking = false; }
    else if (retry) { msg = ['Look! Does it have feathers?', 'Nhìn kìa! Nó có lông vũ không?']; mood = 'think'; }
    if (s.again) talking = true;
    const intro = s.intro && !s.pending && !s.tries.length;
    const PAPER = 'background: #FBF6EA; box-shadow: 0 3px 4px rgba(91, 59, 23, 0.22);';
    const SEL = 'background: #FBF6EA; box-shadow: 5px 6px 0 #E2A52A, 0 3px 4px rgba(91, 59, 23, 0.22);';
    const RIGHT = 'background: #FBF6EA; box-shadow: 5px 6px 0 #3F7A33, 0 3px 4px rgba(91, 59, 23, 0.22);';
    const PEELED = 'background: #E2D4B4; clip-path: polygon(0 0, calc(100% - 64px) 0, 100% 64px, 100% 100%, 0 100%);';
    const card = (id, i) => {
      const tried = s.tries.includes(id);
      let style = PAPER, pic = '', drop = 'none';
      if (s.pending === id) style = SEL;
      else if (right && id === ANS) style = RIGHT;
      else if (tried) { style = PEELED; pic = 'filter: grayscale(1); opacity: 0.42;'; drop = 'drop-shadow(0 3px 3px rgba(91, 59, 23, 0.28))'; }
      return {
        d: (180 + 60 * i) + 'ms', style, pic, drop,
        // Lúc đọc hướng dẫn, thẻ "Đúng" nhún (gật) một nhịp lặp; đây là chuyển động lặp duy nhất của màn lúc đó.
        nudge: intro && id === 'yes' ? 'eNudge' : 'none',
        pressed: (s.pending === id || (tried && id === last)) ? 'true' : 'false',
        off: (done || tried || !!s.pending) ? 'true' : 'false',
        seal: right && id === ANS,
        peel: tried && id !== ANS,
        retry: retry && tried,
        tap: () => {
          if (done || s.pending || tried) return;
          const tries = [...s.tries, id];
          go({ pending: id });
          setTimeout(() => this.setState({ intro: false, tries, pending: null, again: false, p: key }), 900);
        }
      };
    };
    const pips = {};
    for (let i = 1; i <= 6; i++) {
      const cur = i === 6, sz = cur ? 30 : 24, f = cur ? '#E2A52A' : '#3B6E6A';
      pips['p' + i] = 'width: ' + sz + 'px; height: ' + sz + 'px; flex-shrink: 0; border-radius: 2px; background: ' + f + '; box-shadow: 0 2px 3px rgba(91, 59, 23, 0.28);';
    }
    return {
      showVi: this.props.showVi ?? true,
      set1: set.n === 1, set2: set.n === 2,
      pips,
      face: '#m-' + mood,
      swayName: talking && !done && !intro ? 'eSway' : 'none',
      talking, quiet: !talking,
      msgEn: msg[0], msgVi: msg[1],
      replay: () => go({ again: true }),
      yes: card('yes', 0), no: card('no', 1),
      done
    };
  }
}
</script>
