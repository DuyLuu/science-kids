body{margin:0}
a{color:#A93A27}a:hover{color:#1E1B18}
@keyframes eLay { from { opacity: 0; translate: 0 -12px; scale: 1.03; } to { opacity: 1; translate: 0 0; scale: 1; } }
@keyframes eRise { from { translate: 0 105%; } to { translate: 0 0; } }
@keyframes eStamp { 0% { opacity: 0; scale: 1.7; } 55% { opacity: 1; scale: 0.9; } 78% { scale: 1.06; } 100% { opacity: 1; scale: 1; } }
@keyframes ePop { 0% { opacity: 0; scale: 0.4; } 70% { opacity: 1; scale: 1.12; } 100% { opacity: 1; scale: 1; } }
@keyframes eFall { 0% { opacity: 0; translate: 0 -70px; rotate: -50deg; } 15% { opacity: 1; } 100% { opacity: 1; translate: 0 0; rotate: 0deg; } }
@keyframes eSlide { from { opacity: 0; translate: 28px 0; } to { opacity: 1; translate: 0 0; } }
@keyframes eGrow { from { scale: 1 0; } to { scale: 1 1; } }
@keyframes eSway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }
@keyframes eNudge { 0%, 100% { translate: 0 0; } 20% { translate: 0 -5px; } 40% { translate: 0 0; } }
.e-lay { animation: eLay 460ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-rise { animation: eRise 440ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-stamp { animation: eStamp 520ms cubic-bezier(.3, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-pop { animation: ePop 380ms cubic-bezier(.3, .7, .3, 1.2) backwards; animation-delay: var(--d, 0ms); }
.e-fall { animation: eFall 950ms cubic-bezier(.2, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-slide { animation: eSlide 360ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-grow { animation: eGrow 620ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); transform-origin: 50% 100%; }
.e-sway { animation: eSway 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
.e-nudge { animation: eNudge 2.8s ease-in-out 1.2s infinite; }
.e-svg { transform-box: fill-box; transform-origin: 50% 50%; }
.e-press { transition: translate 120ms ease, box-shadow 160ms ease, background-color 160ms ease; }
.e-press:active { translate: 0 3px; }
.e-flip { transition: rotate 560ms cubic-bezier(.3, .7, .3, 1), translate 120ms ease; transform-style: preserve-3d; }
@media (prefers-reduced-motion: reduce) {
  .e-lay, .e-rise, .e-stamp, .e-pop, .e-fall, .e-slide, .e-grow, .e-sway, .e-nudge { animation: none !important; }
  .e-press, .e-flip { transition: none !important; }
}
</style>

          <button onClick="{{goNext}}" aria-label="Câu tiếp" class="e-pop e-press" style="position: absolute; right: 0; bottom: 0; width: 136px; height: 136px; border: none; background: transparent; padding: 0; cursor: pointer"><span class="e-nudge" style="display: block; width: 136px; height: 136px"><svg width="136" height="136" viewBox="0 0 136 136" aria-hidden="true"><path d="M136 12 L136 136 L12 136 Z" fill="#E6D9BC"></path><g filter="url(#paperE)"><path d="M12 136 L136 12 L32 32 Z" fill="#A93A27"></path></g><path transform="translate(36.5 36.5) scale(1.6)" d="M4 10.5h10.2l-4.1-4.1 2.1-2.1L20 12l-7.8 7.7-2.1-2.1 4.1-4.1H4z" fill="#FBF6EA"></path></svg></span></button>

<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["đang đọc câu hỏi","vừa chạm: đọc tên","đúng","sai lần 1: gợi ý","hết lượt: đáp án","sang câu"],"default":"đang đọc câu hỏi"},"showVi":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p: null };
  }
  renderVals() {
    const QS = {
      4: {
        ask: ['Which one is a bird?', 'Con nào là chim?'],
        answer: 'hen',
        cards: [['fish', 'Con cá', 'A fish.', 'Con cá.'], ['hen', 'Con gà', 'A hen.', 'Con gà.'], ['dog', 'Con chó', 'A dog.', 'Con chó.']],
        hint: ['Look for a beak and feathers!', 'Tìm con có mỏ và lông vũ nhé!'],
        right: ['Yes! A hen is a bird.', 'Đúng rồi! Gà có mỏ và lông vũ.'],
        out: ['The hen is the bird.', 'Con gà mới là chim, vì gà có lông vũ.'],
        karaoke: { ask: ['Which one is a ', 'bird', '?'], hint: ['Look for a ', 'beak', ' and feathers!'] }
      },
      5: {
        ask: ['Which one has fur?', 'Con nào có lông mao?'],
        answer: 'cat',
        cards: [['sparrow', 'Chim sẻ', 'A sparrow.', 'Chim sẻ.'], ['cat', 'Con mèo', 'A cat.', 'Con mèo.'], ['duck', 'Con vịt', 'A duck.', 'Con vịt.']],
        hint: ['Fur is soft, like a coat.', 'Lông mao mềm, như chiếc áo ấm.'],
        right: ['Yes! A cat has fur.', 'Đúng rồi! Mèo có lông mao.'],
        out: ['The cat has fur.', 'Con mèo mới có lông mao.'],
        karaoke: { ask: ['Which one has ', 'fur', '?'], hint: ['Fur is ', 'soft', ', like a coat.'] }
      }
    };
    // Tweak "state" đặt màn về một trạng thái; chạm trên bảng thì chơi tiếp từ trạng thái đó.
    const PRESETS = {
      'đang đọc câu hỏi': { q: 4, tries: [], pending: null },
      'vừa chạm: đọc tên': { q: 4, tries: [], pending: 'hen' },
      'đúng': { q: 4, tries: ['hen'], pending: null },
      'sai lần 1: gợi ý': { q: 4, tries: ['fish'], pending: null },
      'hết lượt: đáp án': { q: 4, tries: ['fish', 'dog'], pending: null },
      'sang câu': { q: 5, tries: [], pending: null }
    };
    const preset = PRESETS[this.props.state] ? this.props.state : 'đang đọc câu hỏi';
    const s = this.state.p === preset ? this.state : { ...PRESETS[preset], again: false };
    const go = (next) => this.setState({ q: s.q, tries: s.tries, pending: s.pending, again: false, ...next, p: preset });
    const Q = QS[s.q];
    const ANS = Q.answer;
    const last = s.tries.length ? s.tries[s.tries.length - 1] : null;
    const done = s.tries.includes(ANS) || s.tries.length >= 2;   // max_tries 2
    const right = done && last === ANS;
    const out = done && !right;
    const retry = !done && s.tries.length === 1;
    const named = s.pending ? Q.cards.find((c) => c[0] === s.pending) : null;
    // Lời đang hiện và đang đọc. Đúng và hết lượt: vẽ lúc đọc xong, để mũi tên sang câu là chuyển động lặp duy nhất.
    let msg = Q.ask, mood = 'talk', talking = true, line = 'ask';
    if (named) { msg = [named[2], named[3]]; line = 'name'; }
    else if (right) { msg = Q.right; mood = 'happy'; talking = false; line = 'right'; }
    else if (out) { msg = Q.out; mood = 'idle'; talking = false; line = 'out'; }
    else if (retry) { msg = Q.hint; mood = 'think'; line = 'hint'; }
    if (s.again) talking = true;
    // Chạm thẻ là trả lời (D4): đọc tên hình ~0,9 s rồi chấm.
    const tapCard = (id) => () => {
      if (done || s.pending || s.tries.includes(id)) return;
      const tries = [...s.tries, id];
      go({ pending: id });
      setTimeout(() => this.setState({ q: s.q, tries, pending: null, again: false, p: preset }), 900);
    };
    const PAPER = 'background: #FBF6EA; box-shadow: 0 3px 4px rgba(91, 59, 23, 0.22);';
    const SEL = 'background: #FBF6EA; box-shadow: 5px 6px 0 #E2A52A, 0 3px 4px rgba(91, 59, 23, 0.22);';
    const RIGHT = 'background: #FBF6EA; box-shadow: 5px 6px 0 #3F7A33, 0 3px 4px rgba(91, 59, 23, 0.22);';
    const ANSWER = 'background: #F0C873; box-shadow: 0 6px 0 #E2A52A, 0 8px 8px rgba(91, 59, 23, 0.25);';
    const GRAY = 'filter: grayscale(1); opacity: 0.42;';
    // B: tranh dán trên trang sách. Sai: tranh bong ghim, lệch thêm, góc lật xuống có mũi tên vòng.
    const TILT = ['-1.4deg', '1deg', '-0.7deg'];
    const PEELED = 'background: #E2D4B4; clip-path: polygon(0 0, calc(100% - 72px) 0, 100% 72px, 100% 100%, 0 100%);';
    const cards = Q.cards.map(([id, label], i) => {
      const tried = s.tries.includes(id);
      let style = PAPER, pic = '', rot = TILT[i], shift = '0 0', drop = 'none', pin = true, peel = false;
      if (s.pending === id) style = SEL;
      else if (right && id === ANS) { style = RIGHT; rot = '0deg'; }
      else if (out && id === ANS) { style = ANSWER; rot = '0deg'; }
      else if (tried) { style = PEELED; pic = GRAY; rot = (i % 2 ? '-2.6deg' : '2.4deg'); shift = '0 5px'; drop = 'drop-shadow(0 3px 3px rgba(91, 59, 23, 0.28))'; pin = false; peel = true; }
      return {
        href: '#pic-' + id, label, d: (60 + 50 * i) + 'ms', style, pic, rot, shift, drop, pin, peel,
        pressed: (s.pending === id || (tried && id === last)) ? 'true' : 'false',
        off: (done || tried || !!s.pending) ? 'true' : 'false',
        seal: right && id === ANS,
        retry: retry && tried,
        tap: tapCard(id)
      };
    });
    // Đang đọc: tô nền vàng hoè sát chữ cho từ đang được đọc (karaoke). Đọc xong thì bỏ tô.
    const HL = 'background: #E2A52A; box-shadow: 0 0 0 2px #E2A52A;';
    let k = { a: msg[0], w: '', b: '', hl: '' };
    const kk = line === 'ask' ? Q.karaoke.ask : (line === 'hint' ? Q.karaoke.hint : (line === 'name' ? [msg[0].slice(0, 2), msg[0].slice(2, -1), '.'] : null));
    if (talking && kk) k = { a: kk[0], w: kk[1], b: kk[2], hl: HL };
    // Tiến độ là các trang sách; trang đã làm cùng màu, không lộ đúng/sai (D1).
    const pips = {};
    for (let i = 1; i <= 6; i++) {
      const cur = i === s.q, w = cur ? 20 : 16, h = cur ? 28 : 22, f = cur ? '#E2A52A' : (i < s.q ? '#3B6E6A' : '#E2D4B4');
      pips['p' + i] = 'width: ' + w + 'px; height: ' + h + 'px; flex-shrink: 0; border-radius: 2px; background: ' + f + '; box-shadow: 0 2px 3px rgba(91, 59, 23, 0.28);';
    }
    return {
      showVi: this.props.showVi ?? true,
      pips, progressLabel: 'Câu ' + s.q + ' trên 6',
      face: '#m-' + mood,
      k, msgVi: msg[1],
      replay: () => go({ again: true }),
      isQ4: s.q === 4, isQ5: s.q === 5,
      cards,
      nextBtn: done && s.q === 4,
      nextLink: done && s.q === 5,
      goNext: () => go({ q: 5, tries: [], pending: null })
    };
  }
}
</script>
