<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Phudu:wght@500;700;900&amp;family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#A93A27}a:hover{color:#1E1B18}
@keyframes eLay { from { opacity: 0; translate: 0 -12px; scale: 1.03; } to { opacity: 1; translate: 0 0; scale: 1; } }
@keyframes eRise { from { translate: 0 105%; } to { translate: 0 0; } }
@keyframes eStamp { 0% { opacity: 0; scale: 1.7; } 55% { opacity: 1; scale: 0.9; } 78% { scale: 1.06; } 100% { opacity: 1; scale: 1; } }
@keyframes ePop { 0% { opacity: 0; scale: 0.4; } 70% { opacity: 1; scale: 1.12; } 100% { opacity: 1; scale: 1; } }
@keyframes eFall { 0% { opacity: 0; translate: 0 -70px; rotate: -50deg; } 15% { opacity: 1; } 100% { opacity: 1; translate: 0 0; rotate: 0deg; } }
@keyframes eSlide { from { opacity: 0; translate: 28px 0; } to { opacity: 1; translate: 0 0; } }
@keyframes eGrow { from { scale: 1 0; } to { scale: 1 1; } }
@keyframes eSway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }
@keyframes eNudge { 0%, 100% { translate: 0 0; } 20% { translate: 0 -5px; } 40% { translate: 0 0; } }
.e-lay { animation: eLay 460ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-rise { animation: eRise 440ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-stamp { animation: eStamp 520ms cubic-bezier(.3, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-pop { animation: ePop 380ms cubic-bezier(.3, .7, .3, 1.2) backwards; animation-delay: var(--d, 0ms); }
.e-fall { animation: eFall 950ms cubic-bezier(.2, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-slide { animation: eSlide 360ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-grow { animation: eGrow 620ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); transform-origin: 50% 100%; }
.e-sway { animation: eSway 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
.e-nudge { animation: eNudge 2.8s ease-in-out 1.2s infinite; }
.e-svg { transform-box: fill-box; transform-origin: 50% 50%; }
.e-press { transition: translate 120ms ease, box-shadow 160ms ease, background-color 160ms ease; }
.e-press:active { translate: 0 3px; }
.e-flip { transition: rotate 560ms cubic-bezier(.3, .7, .3, 1), translate 120ms ease; transform-style: preserve-3d; }
@media (prefers-reduced-motion: reduce) {
  .e-lay, .e-rise, .e-stamp, .e-pop, .e-fall, .e-slide, .e-grow, .e-sway, .e-nudge { animation: none !important; }
  .e-press, .e-flip { transition: none !important; }
}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F0E6CF; font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif; color: #1E1B18">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tray: ['rice'], full: false };
  }
  renderVals() {
    const s = this.state;
    const F = {
      rice: { name: 'Cơm', g: 'carb' }, bread: { name: 'Bánh mì', g: 'carb' },
      fish: { name: 'Cá kho', g: 'protein' }, egg: { name: 'Trứng', g: 'protein' },
      greens: { name: 'Rau muống', g: 'veg' }, banana: { name: 'Chuối', g: 'veg' },
      candy: { name: 'Kẹo', g: 'sweet' }, soda: { name: 'Nước ngọt', g: 'sweet' }
    };
    const color = { carb: '#E2A52A', protein: '#A93A27', veg: '#3B6E6A', sweet: '#2E4A6E' };
    const has = (g) => s.tray.some((id) => F[id].g === g);
    const carb = has('carb'), protein = has('protein'), veg = has('veg'), sweet = has('sweet');
    const balanced = carb && protein && veg && !sweet;
    let msg = ['Pick foods for a healthy tray.', 'Chọn món cho mâm cơm khoẻ mạnh nhé.'];
    if (s.full) msg = ['Your tray is full!', 'Mâm đầy rồi — chạm món trong mâm để bỏ ra.'];
    else if (balanced) msg = ['Great! Your tray is balanced.', 'Tuyệt! Mâm cơm cân bằng rồi.'];
    else if (sweet) msg = ['Sweets are for sometimes.', 'Kẹo và nước ngọt chỉ nên ăn ít thôi.'];
    else if (s.tray.length && !protein) msg = ['Add some protein!', 'Thêm một món giàu chất đạm nhé!'];
    else if (s.tray.length && !veg) msg = ['Add vegetables or fruit!', 'Mâm còn thiếu rau hoặc quả!'];
    else if (s.tray.length && !carb) msg = ['Add some carbohydrates!', 'Thêm cơm hoặc bánh mì nhé!'];
    const toggle = (id) => () => {
      if (s.tray.includes(id)) this.setState({ tray: s.tray.filter((x) => x !== id), full: false });
      else if (s.tray.length >= 4) this.setState({ full: true });
      else this.setState({ tray: [...s.tray, id], full: false });
    };
    const tap = {}, shelf = {}, inTray = {};
    Object.keys(F).forEach((id) => {
      tap[id] = toggle(id);
      inTray[id] = s.tray.includes(id);
      shelf[id] = inTray[id] ? 'box-shadow: 5px 6px 0 #E2A52A, 0 3px 4px rgba(91, 59, 23, 0.22);' : 'box-shadow: 0 3px 4px rgba(91, 59, 23, 0.22);';
    });
    const okStyle = 'background: #A93A27; color: #FBF6EA; box-shadow: 0 2px 3px rgba(91, 59, 23, 0.28);';
    const noStyle = 'background: #E2D4B4; color: #4E4336; box-shadow: inset 0 2px 4px rgba(91, 59, 23, 0.22);';
    return {
      msgEn: msg[0], msgVi: msg[1],
      trayItems: s.tray.map((id) => ({ name: F[id].name, color: color[F[id].g], remove: toggle(id) })),
      empties: Array.from({ length: 4 - s.tray.length }, (_, i) => ({ i })),
      meters: [
        { label: 'Bột đường', ok: carb, style: carb ? okStyle : noStyle },
        { label: 'Đạm', ok: protein, style: protein ? okStyle : noStyle },
        { label: 'Rau & quả', ok: veg, style: veg ? okStyle : noStyle }
      ],
      hasSweet: sweet,
      balanced, notBalanced: !balanced,
      tap, shelf, inTray
    };
  }
}
</script>
