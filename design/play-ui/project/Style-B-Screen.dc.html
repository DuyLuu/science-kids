<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Style B · Cắt giấy nhiều lớp · màn Học</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;900&amp;family=Lexend:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2B33D}a:hover{color:#F5F2EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1D4330; font-family: 'Lexend', 'Segoe UI', sans-serif; color: #F5F2EA">
  <svg width="0" height="0" aria-hidden="true" style="position: absolute">
    <defs>
      <filter id="paperB" x="-10%" y="-10%" width="120%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="t"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="3" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap>
        <feDropShadow in="d" dx="0" dy="3" stdDeviation="2" flood-color="#06170E" flood-opacity="0.5"></feDropShadow>
      </filter>
    </defs>
  </svg>

  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 0">

      <path d="M0 0 C 60 -58, 220 -60, 300 0 Z" fill="#2B6544"></path>
      <path d="M0 0 C 60 54, 220 58, 300 0 Z" fill="#245A3C"></path>
      <path d="M0 0 L 300 0" stroke="#3E8A57" stroke-width="3"></path>
      <path d="M100 2 L 116 40 M170 2 L 184 44 M236 2 L 246 34" stroke="#1D4330" stroke-width="3"></path>
    </g>
    <g transform="translate(-70 860) rotate(-24)" filter="url(#paperB)">
      <path d="M0 0 C 60 -58, 220 -60, 300 0 Z" fill="#2B6544"></path>
      <path d="M0 0 C 60 54, 220 58, 300 0 Z" fill="#245A3C"></path>
      <path d="M0 0 L 300 0" stroke="#3E8A57" stroke-width="3"></path>
    </g>
  </svg>

  <div style="position: relative; z-index: 1; height: 844px; box-sizing: border-box; padding: 16px 18px 22px 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <button aria-label="Đóng bài học" style="width: 56px; height: 56px; flex-shrink: 0; padding: 0; border: none; background: transparent; cursor: pointer">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><g filter="url(#paperB)"><circle cx="28" cy="27" r="25" fill="#F5F2EA"></circle></g><path d="M20 19l16 16M36 19L20 35" stroke="#1D4330" stroke-width="3.4" stroke-linecap="round"></path></svg>
      </button>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px">
        <svg width="190" height="28" viewBox="0 0 190 28" role="img" aria-label="Bước 2 trên 5: Học">
          <g filter="url(#paperB)"><rect x="2" y="6" width="186" height="16" rx="8" fill="#2B6544"></rect></g>
          <g filter="url(#paperB)"><rect x="2" y="6" width="76" height="16" rx="8" fill="#E4572E"></rect></g>
          <g filter="url(#paperB)"><rect x="2" y="6" width="40" height="16" rx="8" fill="#F2B33D"></rect></g>
          <path d="M115 8v12M152 8v12" stroke="#1D4330" stroke-width="2"></path>
        </svg>
        <span style="font-size: 12px; font-weight: 600; color: #CFE3C8">bước 2 · Học</span>
      </div>
      <button aria-label="Nghe câu tiếng Anh" style="width: 56px; height: 56px; flex-shrink: 0; padding: 0; border: none; background: transparent; cursor: pointer">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><g filter="url(#paperB)"><circle cx="28" cy="27" r="25" fill="#F5F2EA"></circle></g><g transform="translate(16 15)" fill="none" stroke="#1D4330" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></g></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
      <span style="font-family: 'Grandstander', sans-serif; font-size: 50px; font-weight: 900; line-height: 1; letter-spacing: -0.5px; color: #F5F2EA">Protein</span>
      <span style="display: inline-flex; align-items: center; height: 34px; padding: 0 16px 0 22px; background: #F2B33D; color: #3A1F05; font-size: 16px; font-weight: 700; clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 50%); transform: rotate(-2deg)">Chất đạm · nhóm 2/4</span>
    </div>

    <svg viewBox="0 0 340 280" role="img" aria-label="Đĩa men lam trên lá chuối, có cá, trứng và đậu phụ" style="display: block; width: 100%; height: auto">
      <g transform="translate(6 236) rotate(-32)" filter="url(#paperB)">
        <path d="M0 0 C 70 -62, 260 -64, 360 0 Z" fill="#3E8A57"></path>
        <path d="M0 0 C 70 58, 260 62, 360 0 Z" fill="#2B6544"></path>
        <path d="M0 0 L 360 0" stroke="#7DB46C" stroke-width="3"></path>
        <path d="M110 3 L 128 46 M180 3 L 196 50 M250 3 L 262 40" stroke="#1D4330" stroke-width="3"></path>
      </g>
      <g filter="url(#paperB)"><circle cx="170" cy="146" r="110" fill="#F4F6F2"></circle></g>
      <circle cx="170" cy="146" r="98" fill="none" stroke="#2F5D9E" stroke-width="3"></circle>
      <circle cx="170" cy="146" r="104" fill="none" stroke="#2F5D9E" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"></circle>
      <g transform="translate(42 58) scale(0.8)">
        <g filter="url(#paperB)"><path d="M128 47 C 138 26, 170 24, 186 46 Z" fill="#A4521E"></path><path d="M150 96 C 158 112, 176 112, 182 94 Z" fill="#A4521E"></path></g>
        <g filter="url(#paperB)"><path d="M70 72 C 92 38, 168 30, 210 62 L 246 38 C 238 62 238 84 246 106 L 210 82 C 168 112, 92 106, 70 72 Z" fill="#D98B2B"></path></g>
        <g filter="url(#paperB)"><path d="M96 74 C 122 58, 172 56, 202 70 C 172 84, 122 88, 96 74 Z" fill="#EDB45A"></path></g>
        <g filter="url(#paperB)"><path d="M212 63 L 246 38 C 238 62 238 84 246 106 L 212 81 Z" fill="#A4521E"></path></g>
        <path d="M122 52 Q 113 72 122 92" fill="none" stroke="#A4521E" stroke-width="4" stroke-linecap="round"></path>
        <g filter="url(#paperB)"><circle cx="98" cy="66" r="9" fill="#F4F6F2"></circle></g>
        <circle cx="99" cy="66" r="4.5" fill="#10261A"></circle>
      </g>
      <g filter="url(#paperB)"><ellipse cx="124" cy="196" rx="23" ry="29" fill="#E8C08A"></ellipse></g>
      <g filter="url(#paperB)"><ellipse cx="168" cy="206" rx="22" ry="25" fill="#FFFFFF"></ellipse></g>
      <g filter="url(#paperB)"><circle cx="168" cy="209" r="11" fill="#F6B83C"></circle></g>
      <g transform="translate(66 64) scale(0.72)" filter="url(#paperB)">
        <path d="M196 150 L 248 140 L 280 154 L 228 165 Z" fill="#F7EBC2"></path>
        <path d="M196 150 L 228 165 L 228 204 L 196 189 Z" fill="#DFC27E"></path>
        <path d="M228 165 L 280 154 L 280 193 L 228 204 Z" fill="#ECD69C"></path>
      </g>
      <g transform="translate(232 40) rotate(8)">
        <g filter="url(#paperB)"><rect width="84" height="26" rx="4" fill="#F5F2EA"></rect></g>
        <circle cx="10" cy="13" r="3" fill="#1D4330"></circle>
        <text x="18" y="18" font-family="Lexend, sans-serif" font-size="13" font-weight="700" fill="#1D3B2A">fish · cá</text>
      </g>
      <g transform="translate(10 228) rotate(-6)">
        <g filter="url(#paperB)"><rect width="100" height="26" rx="4" fill="#F5F2EA"></rect></g>
        <circle cx="10" cy="13" r="3" fill="#1D4330"></circle>
        <text x="18" y="18" font-family="Lexend, sans-serif" font-size="13" font-weight="700" fill="#1D3B2A">egg · trứng</text>
      </g>
      <g transform="translate(220 228) rotate(5)">
        <g filter="url(#paperB)"><rect width="112" height="26" rx="4" fill="#F5F2EA"></rect></g>
        <circle cx="10" cy="13" r="3" fill="#1D4330"></circle>
        <text x="18" y="18" font-family="Lexend, sans-serif" font-size="13" font-weight="700" fill="#1D3B2A">tofu · đậu phụ</text>
      </g>
    </svg>

    <div style="filter: drop-shadow(0 4px 3px rgba(4, 20, 12, 0.45))">
      <div style="background: #F5F2EA; color: #1D3B2A; padding: 18px 16px 14px 16px; clip-path: polygon(0 6px, 6% 1px, 12% 5px, 19% 0, 27% 4px, 35% 1px, 43% 6px, 52% 2px, 60% 5px, 68% 0, 77% 4px, 85% 1px, 93% 5px, 100% 2px, 100% 100%, 0 100%); display: flex; flex-direction: column; gap: 6px">
        <p style="margin: 0; font-size: 21px; font-weight: 700; line-height: 1.3">Protein helps your body <span style="color: #B53A24">grow strong</span>.</p>
        <p style="margin: 0; font-size: 15px; line-height: 1.4; color: #3D5546">Chất đạm giúp cơ thể lớn lên khoẻ mạnh.</p>
      </div>
    </div>

    <div style="flex: 1"></div>

    <button style="position: relative; height: 66px; border: none; background: transparent; padding: 0; cursor: pointer; font-family: 'Grandstander', sans-serif; font-size: 24px; font-weight: 900; color: #3A1F05">
      <svg width="100%" height="100%" viewBox="0 0 354 66" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0"><g filter="url(#paperB)"><rect x="4" y="10" width="346" height="52" rx="16" fill="#C2412A"></rect></g><g filter="url(#paperB)"><rect x="4" y="3" width="346" height="52" rx="16" fill="#F2B33D"></rect></g></svg>
      <span style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px">Tiếp<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A1F05" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </button>
  </div>

  <svg width="390" height="844" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; mix-blend-mode: overlay; opacity: 0.22">
    <filter id="fiberB" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="9"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
    <rect width="390" height="844" filter="url(#fiberB)"></rect>
  </svg>
</div>
</x-dc>
