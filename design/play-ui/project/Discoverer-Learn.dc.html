<script type="text/x-dc" data-dc-script data-props='{"showVi":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'carb', seen: { carb: true } };
  }
  renderVals() {
    const s = this.state;
    const data = {
      carb: { en: 'Carbohydrates', vi: 'Chất bột đường', color: '#E2A52A', sentence: 'Carbohydrates give us energy.', sentenceVi: 'Chất bột đường cho ta năng lượng.', foods: ['cơm', 'bánh mì', 'khoai lang'] },
      protein: { en: 'Protein', vi: 'Chất đạm', color: '#A93A27', sentence: 'Protein helps our body grow and repair.', sentenceVi: 'Chất đạm giúp cơ thể lớn lên và tự phục hồi.', foods: ['cá', 'trứng', 'đậu phụ'] },
      fat: { en: 'Fats', vi: 'Chất béo', color: '#8A5E3B', sentence: 'Fats give us energy and keep us warm.', sentenceVi: 'Chất béo cho năng lượng và giữ ấm cơ thể.', foods: ['dầu ăn', 'lạc', 'quả bơ'] },
      vit: { en: 'Vitamins & minerals', vi: 'Vitamin, chất khoáng', color: '#3B6E6A', sentence: 'Vitamins and minerals help us stay healthy.', sentenceVi: 'Vitamin và chất khoáng giúp ta khoẻ mạnh.', foods: ['rau muống', 'cam', 'sữa'] }
    };
    const ids = ['carb', 'protein', 'fat', 'vit'];
    const groups = ids.map((id) => ({
      ...data[id],
      selected: s.sel === id ? 'true' : 'false',
      seen: !!s.seen[id],
      ring: s.sel === id ? 'box-shadow: 5px 6px 0 #E2A52A, 0 3px 4px rgba(91, 59, 23, 0.22);' : 'box-shadow: 0 3px 4px rgba(91, 59, 23, 0.22);',
      pick: () => this.setState({ sel: id, seen: { ...s.seen, [id]: true } })
    }));
    return {
      showVi: this.props.showVi ?? true,
      groups,
      cur: data[s.sel],
      is: { carb: s.sel === 'carb', protein: s.sel === 'protein', fat: s.sel === 'fat', vit: s.sel === 'vit' },
      seenCount: ids.filter((id) => s.seen[id]).length
    };
  }
}
</script>
