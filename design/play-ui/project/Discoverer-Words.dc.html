<style>
body{margin:0}
a{color:#A93A27}a:hover{color:#1E1B18}
@keyframes eLay { from { opacity: 0; translate: 0 -12px; scale: 1.03; } to { opacity: 1; translate: 0 0; scale: 1; } }
@keyframes eRise { from { translate: 0 105%; } to { translate: 0 0; } }
@keyframes eStamp { 0% { opacity: 0; scale: 1.7; } 55% { opacity: 1; scale: 0.9; } 78% { scale: 1.06; } 100% { opacity: 1; scale: 1; } }
@keyframes ePop { 0% { opacity: 0; scale: 0.4; } 70% { opacity: 1; scale: 1.12; } 100% { opacity: 1; scale: 1; } }
@keyframes eFall { 0% { opacity: 0; translate: 0 -70px; rotate: -50deg; } 15% { opacity: 1; } 100% { opacity: 1; translate: 0 0; rotate: 0deg; } }
@keyframes eSlide { from { opacity: 0; translate: 28px 0; } to { opacity: 1; translate: 0 0; } }
@keyframes eGrow { from { scale: 1 0; } to { scale: 1 1; } }
@keyframes eSway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }
@keyframes eNudge { 0%, 100% { translate: 0 0; } 20% { translate: 0 -5px; } 40% { translate: 0 0; } }
.e-lay { animation: eLay 460ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-rise { animation: eRise 440ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-stamp { animation: eStamp 520ms cubic-bezier(.3, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-pop { animation: ePop 380ms cubic-bezier(.3, .7, .3, 1.2) backwards; animation-delay: var(--d, 0ms); }
.e-fall { animation: eFall 950ms cubic-bezier(.2, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-slide { animation: eSlide 360ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-grow { animation: eGrow 620ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); transform-origin: 50% 100%; }
.e-sway { animation: eSway 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
.e-nudge { animation: eNudge 2.8s ease-in-out 1.2s infinite; }
.e-svg { transform-box: fill-box; transform-origin: 50% 50%; }
.e-press { transition: translate 120ms ease, box-shadow 160ms ease, background-color 160ms ease; }
.e-press:active { translate: 0 3px; }
.e-flip { transition: rotate 560ms cubic-bezier(.3, .7, .3, 1), translate 120ms ease; transform-style: preserve-3d; }
@media (prefers-reduced-motion: reduce) {
  .e-lay, .e-rise, .e-stamp, .e-pop, .e-fall, .e-slide, .e-grow, .e-sway, .e-nudge { animation: none !important; }
  .e-press, .e-flip { transition: none !important; }
}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {

  renderVals() {
    const s = this.state;
    const W = [
      { id: 'nutrient', en: 'nutrient', vi: 'chất dinh dưỡng', ex: 'Food gives us nutrients.', exVi: 'Thức ăn cho ta chất dinh dưỡng.' },
      { id: 'carb', en: 'carbohydrate', vi: 'chất bột đường', ex: 'Rice is a carbohydrate.', exVi: 'Cơm thuộc nhóm chất bột đường.' },
      { id: 'protein', en: 'protein', vi: 'chất đạm', ex: 'Fish is rich in protein.', exVi: 'Cá giàu chất đạm.' },
      { id: 'fat', en: 'fat', vi: 'chất béo', ex: 'Fat keeps us warm.', exVi: 'Chất béo giữ ấm cơ thể.' },
      { id: 'vitamin', en: 'vitamin', vi: 'vitamin', ex: 'Oranges have vitamins.', exVi: 'Quả cam có vitamin.' },
      { id: 'fibre', en: 'fibre', vi: 'chất xơ', ex: 'Vegetables have fibre.', exVi: 'Rau có chất xơ.' },
      { id: 'energy', en: 'energy', vi: 'năng lượng', ex: 'Food gives us energy.', exVi: 'Thức ăn cho ta năng lượng.' },
      { id: 'healthy', en: 'healthy', vi: 'khoẻ mạnh', ex: 'We eat well to stay healthy.', exVi: 'Ta ăn uống đủ chất để khoẻ mạnh.' }
    ];
    const n = W.length;
    const done = s.idx >= n;
    const cur = W[Math.min(s.idx, n - 1)];
    const is = {};
    W.forEach((w) => { is[w.id] = !done && w.id === cur.id; });

    const KNOWN = 'background: #A93A27; box-shadow: 0 1px 2px rgba(91, 59, 23, 0.3);';
    const SEEN = 'background: #FBF6EA; box-shadow: 0 1px 2px rgba(91, 59, 23, 0.3);';
    const CUR = 'background: #E2A52A; box-shadow: 0 1px 2px rgba(91, 59, 23, 0.3);';
    const NOT = 'background: #E6D9BC; box-shadow: inset 0 1px 3px rgba(91, 59, 23, 0.28);';
    const segs = W.map((w, i) => ({ style: i < s.idx ? (s.marks[i] === 'k' ? KNOWN : SEEN) : (i === s.idx ? CUR : NOT) }));

    const next = (mark) => {
      if (s.idx >= n) return;
      this.setState({ idx: s.idx + 1, flipped: false, known: s.known + (mark === 'k' ? 1 : 0), marks: [...s.marks, mark] });
    };
    const f = s.flipped;
    return {
      cur, is, segs, done,
      notDone: !done,
      evenCard: !done && s.idx % 2 === 0,
      oddCard: !done && s.idx % 2 === 1,
      layerA: s.idx <= n - 3,
      layerB: s.idx <= n - 2,
      cardRot: f ? 'y 180deg' : 'y 0deg',
      cardDelay: s.idx === 0 ? '140ms' : '0ms',
      frontHidden: f ? 'true' : 'false',
      backHidden: f ? 'false' : 'true',
      frontPE: f ? 'none' : 'auto',
      backPE: f ? 'auto' : 'none',
      frontTab: f ? '-1' : '0',
      backTab: f ? '0' : '-1',
      known: s.known,
      knownOdd: s.known % 2 === 1,
      knownEven: s.known % 2 === 0,
      pos: Math.min(s.idx + 1, n),
      flip: () => this.setState({ flipped: !f }),
      review: () => next('r'),
      know: () => next('k'),
      restart: () => this.setState({ idx: 0, flipped: false, known: 0, marks: [] })
    };
  }
}
