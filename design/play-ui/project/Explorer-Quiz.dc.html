          <circle cx="25.5" cy="46" r="3" fill="#1E1B18"></circle>

        <sc-if value="{{badge.fish}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; right: 12px; top: 12px; filter: drop-shadow(0 2px 3px rgba(91, 59, 23, 0.3))"><span style="position: relative; display: block; padding: 6px 20px 6px 10px; background: #FBF6EA; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); font-family: 'Phudu', sans-serif; font-size: 16px; font-weight: 700; color: #1E1B18"><span style="position: absolute; top: 0; right: 0; width: 12px; height: 12px; background: #C9B993; clip-path: polygon(0 0, 0 100%, 100% 100%)"></span>Thử lại</span></span></sc-if>
      </button>
      <button onClick="{{chooseHen}}" aria-label="Con gà" aria-pressed="{{badge.hen}}" style="position: relative; height: 108px; box-sizing: border-box; border: none; border-radius: 20px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; {{style.hen}}">
        <svg width="100" height="100" viewBox="0 0 100 100" aria-hidden="true">
          <g filter="url(#paperE)"><path d="M14 52 Q2 30 18 24 Q22 40 28 46 Z" fill="#2F5B57"></path></g>
          <g fill="#E2A52A"><rect x="41" y="80" width="3.2" height="12" rx="1.6"></rect><rect x="53" y="80" width="3.2" height="12" rx="1.6"></rect><ellipse cx="42.6" cy="92" rx="4.5" ry="1.8"></ellipse><ellipse cx="54.6" cy="92" rx="4.5" ry="1.8"></ellipse></g>
          <g filter="url(#paperE)"><ellipse cx="46" cy="60" rx="30" ry="24" fill="#C98B4E"></ellipse></g>
          <g filter="url(#paperE)"><path d="M30 56 Q46 46 58 60 Q42 70 30 56 Z" fill="#A0663A"></path></g>
          <g filter="url(#paperE)"><path d="M59 26 Q61 12 67 19 Q70 9 76 22 Z" fill="#A93A27"></path></g>
          <g filter="url(#paperE)"><circle cx="68" cy="36" r="15" fill="#C98B4E"></circle></g>
          <g filter="url(#paperE)"><path d="M82 33 L94 38 L82 43 Z" fill="#E2A52A"></path></g>
          <g filter="url(#paperE)"><path d="M78 43 Q82 54 77 52 Q73 48 75 43 Z" fill="#A93A27"></path></g>
          <g filter="url(#paperE)"><circle cx="71" cy="33" r="4.4" fill="#FBF6EA"></circle></g>
          <circle cx="71.5" cy="33" r="2.5" fill="#1E1B18"></circle>
        </svg>
        <sc-if value="{{badge.hen}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; right: 14px; top: 14px; width: 56px; height: 56px; border-radius: 3px; background: #A93A27; transform: rotate(-8deg); box-shadow: 0 2px 3px rgba(91, 59, 23, 0.3); display: flex; align-items: center; justify-content: center; font-family: 'Phudu', sans-serif; font-size: 16px; font-weight: 900; letter-spacing: 1px; color: #FBF6EA">ĐÚNG</span></sc-if>
      </button>
      <button onClick="{{chooseDog}}" aria-label="Con chó" aria-pressed="{{badge.dog}}" style="position: relative; height: 108px; box-sizing: border-box; border: none; border-radius: 20px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; {{style.dog}}">
        <svg width="100" height="100" viewBox="0 0 100 100" aria-hidden="true">
          <g filter="url(#paperE)"><ellipse cx="50" cy="77" rx="24" ry="15" fill="#D9A066"></ellipse></g>
          <g filter="url(#paperE)"><circle cx="50" cy="42" r="22" fill="#D9A066"></circle></g>
          <g filter="url(#paperE)" fill="#8A5E3B"><path d="M31 28 Q16 34 21 58 Q31 54 33 42 Z"></path><path d="M69 28 Q84 34 79 58 Q69 54 67 42 Z"></path></g>
          <g filter="url(#paperE)"><ellipse cx="50" cy="53" rx="10" ry="8" fill="#EFD9B8"></ellipse></g>
          <ellipse cx="50" cy="49" rx="4" ry="3" fill="#1E1B18"></ellipse>
          <circle cx="42" cy="39" r="3.6" fill="#1E1B18"></circle><circle cx="58" cy="39" r="3.6" fill="#1E1B18"></circle>
        </svg>
        <sc-if value="{{badge.dog}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; right: 12px; top: 12px; filter: drop-shadow(0 2px 3px rgba(91, 59, 23, 0.3))"><span style="position: relative; display: block; padding: 6px 20px 6px 10px; background: #FBF6EA; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); font-family: 'Phudu', sans-serif; font-size: 16px; font-weight: 700; color: #1E1B18"><span style="position: absolute; top: 0; right: 0; width: 12px; height: 12px; background: #C9B993; clip-path: polygon(0 0, 0 100%, 100% 100%)"></span>Thử lại</span></span></sc-if>
      </button>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 8px">
      <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true" style="flex-shrink: 0">
        <rect x="48.5" y="9" width="3" height="18" rx="1.5" fill="#1E1B18"></rect>
        <g filter="url(#paperE)"><circle cx="50" cy="9" r="6.5" fill="#E2A52A"></circle></g>
        <g filter="url(#paperE)"><circle cx="50" cy="58" r="36" fill="#3B6E6A"></circle></g>
        <g filter="url(#paperE)"><ellipse cx="50" cy="73" rx="21" ry="14" fill="#F0E6CF"></ellipse></g>
        <g filter="url(#paperE)"><circle cx="38" cy="50" r="9.5" fill="#FBF6EA"></circle><circle cx="62" cy="50" r="9.5" fill="#FBF6EA"></circle></g>

        <circle cx="27" cy="62" r="4.5" fill="#A93A27" opacity="0.55"></circle><circle cx="73" cy="62" r="4.5" fill="#A93A27" opacity="0.55"></circle>
      </svg>
      <div style="flex: 1; background: #FBF6EA; border-radius: 20px 20px 20px 4px; box-shadow: 0 3px 4px rgba(91, 59, 23, 0.22); padding: 10px 14px; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 19px; font-weight: 700; line-height: 1.22">{{msgEn}}</span>
        <span style="font-size: 14px; line-height: 1.35; color: #4E4336">{{msgVi}}</span>
      </div>

    <div style="flex: 1"></div>
    <sc-if value="{{correct}}" hint-placeholder-val="{{false}}">
      <a href="Explorer-Reward.dc.html" style="position: relative; display: block; height: 84px; flex-shrink: 0; text-decoration: none; font-family: 'Phudu', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 0.5px; color: #FBF6EA">
        <svg width="100%" height="100%" viewBox="0 0 350 84" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0"><g filter="url(#paperE)"><rect x="4" y="10" width="342" height="70" rx="18" fill="#6E2216"></rect></g><g filter="url(#paperE)"><rect x="4" y="3" width="342" height="70" rx="18" fill="#A93A27"></rect></g></svg>
        <span style="position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; height: 76px">Câu tiếp<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5h10.2l-4.1-4.1 2.1-2.1L20 12l-7.8 7.7-2.1-2.1 4.1-4.1H4z" fill="#FBF6EA"></path></svg></span>
      </a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { choice: null };
  }
  renderVals() {
    const c = this.state.choice;
    const base = 'background: #FBF6EA; box-shadow: 0 3px 4px rgba(91, 59, 23, 0.22);';
    const right = 'background: #FBF6EA; box-shadow: 5px 6px 0 #E2A52A, 0 3px 4px rgba(91, 59, 23, 0.22);';
    const wrong = 'background: #E2D4B4; box-shadow: 0 2px 3px rgba(91, 59, 23, 0.18);';
    const styleFor = (id) => c !== id ? base : (id === 'hen' ? right : wrong);
    let msg = ['Tap a picture!', 'Chạm vào một hình nhé!'];
    if (c === 'hen') msg = ['Yes! A hen is a bird.', 'Đúng rồi! Con gà là chim — có mỏ và lông vũ.'];
    else if (c) msg = ['Look for a beak and feathers!', 'Gần đúng rồi! Tìm con có mỏ và lông vũ nhé.'];
    return {
      style: { fish: styleFor('fish'), hen: styleFor('hen'), dog: styleFor('dog') },
      badge: { fish: c === 'fish', hen: c === 'hen', dog: c === 'dog' },
      msgEn: msg[0], msgVi: msg[1],
      correct: c === 'hen',
      chooseFish: () => this.setState({ choice: 'fish' }),
      chooseHen: () => this.setState({ choice: 'hen' }),
      chooseDog: () => this.setState({ choice: 'dog' })
    };
  }
}
</script>
