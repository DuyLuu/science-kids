        <span style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; height: 76px"><span>Đã xếp {{placedCount}}/4 con vật</span></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null, placed: {}, last: 'start' };
  }
  renderVals() {
    const s = this.state;
    const A = {
      sparrow: { group: 'bird', ok: ['Yes! A sparrow is a bird.', 'Đúng rồi! Chim sẻ là chim.'], hint: ['Look! Does it have feathers?', 'Nhìn kìa! Nó có lông vũ không?'], vi: 'chim sẻ' },
      fish: { group: 'fish', ok: ['Yes! A goldfish is a fish.', 'Đúng rồi! Cá vàng là cá.'], hint: ['Does it have fins and live in water?', 'Nó có vây và sống dưới nước không?'], vi: 'cá vàng' },
      cat: { group: 'mammal', ok: ['Yes! A cat is a mammal.', 'Đúng rồi! Mèo là thú, có lông mao.'], hint: ['Does it have fur?', 'Nó có lông mao không?'], vi: 'mèo' },
      duck: { group: 'bird', ok: ['Yes! A duck is a bird too.', 'Đúng rồi! Vịt cũng có lông vũ và mỏ.'], hint: ['Look! Does it have feathers?', 'Nhìn kìa! Nó có lông vũ không?'], vi: 'vịt' }
    };
    const ids = ['sparrow', 'fish', 'cat', 'duck'];
    const placedCount = ids.filter((id) => s.placed[id]).length;
    let msg = ['Tap an animal, then tap its group.', 'Chạm một con vật, rồi chạm vào nhóm của nó.'];
    const [kind, who] = (s.last || 'start').split(':');
    if (placedCount === 4) msg = ['Great sorting!', 'Con xếp giỏi quá!'];
    else if (kind === 'picked') msg = ['Now tap its group!', 'Giờ chạm vào nhóm của ' + A[who].vi + ' nhé!'];
    else if (kind === 'ok') msg = A[who].ok;
    else if (kind === 'wrong') msg = A[who].hint;
    else if (kind === 'noPick') msg = ['Tap an animal first!', 'Chạm vào một con vật trước nhé!'];
    const pick = (id) => () => this.setState({ picked: id, last: 'picked:' + id });
    const drop = (g) => () => {
      if (!s.picked) { this.setState({ last: 'noPick' }); return; }
      if (A[s.picked].group === g) {
        this.setState({ placed: { ...s.placed, [s.picked]: true }, picked: null, last: 'ok:' + s.picked });
      } else {
        this.setState({ last: 'wrong:' + s.picked });
      }
    };
    const trayHas = {}, trayEmpty = {}, trayStyle = {}, inBasket = {};
    ids.forEach((id) => {
      trayHas[id] = !s.placed[id];
      trayEmpty[id] = !!s.placed[id];
      inBasket[id] = !!s.placed[id];
      trayStyle[id] = s.picked === id
        ? 'background: #FBF6EA; box-shadow: 5px 6px 0 #E2A52A, 0 3px 4px rgba(91, 59, 23, 0.22); transform: translateY(-8px);'
        : 'background: #FBF6EA; box-shadow: 0 3px 4px rgba(91, 59, 23, 0.22);';
    });
    return {
      msgEn: msg[0], msgVi: msg[1],
      trayHas, trayEmpty, trayStyle, inBasket,
      placedCount,
      done: placedCount === 4,
      notDone: placedCount < 4,
      pickSparrow: pick('sparrow'), pickFish: pick('fish'), pickCat: pick('cat'), pickDuck: pick('duck'),
      dropBird: drop('bird'), dropFish: drop('fish'), dropMammal: drop('mammal')
    };
  }
}
</script>
