<style>
body{margin:0}
a{color:#A93A27}a:hover{color:#1E1B18}
@keyframes eLay { from { opacity: 0; translate: 0 -12px; scale: 1.03; } to { opacity: 1; translate: 0 0; scale: 1; } }
@keyframes eRise { from { translate: 0 105%; } to { translate: 0 0; } }
@keyframes eStamp { 0% { opacity: 0; scale: 1.7; } 55% { opacity: 1; scale: 0.9; } 78% { scale: 1.06; } 100% { opacity: 1; scale: 1; } }
@keyframes ePop { 0% { opacity: 0; scale: 0.4; } 70% { opacity: 1; scale: 1.12; } 100% { opacity: 1; scale: 1; } }
@keyframes eFall { 0% { opacity: 0; translate: 0 -70px; rotate: -50deg; } 15% { opacity: 1; } 100% { opacity: 1; translate: 0 0; rotate: 0deg; } }
@keyframes eSlide { from { opacity: 0; translate: 28px 0; } to { opacity: 1; translate: 0 0; } }
@keyframes eGrow { from { scale: 1 0; } to { scale: 1 1; } }
@keyframes eSway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }
@keyframes eNudge { 0%, 100% { translate: 0 0; } 20% { translate: 0 -5px; } 40% { translate: 0 0; } }
.e-lay { animation: eLay 460ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-rise { animation: eRise 440ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-stamp { animation: eStamp 520ms cubic-bezier(.3, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-pop { animation: ePop 380ms cubic-bezier(.3, .7, .3, 1.2) backwards; animation-delay: var(--d, 0ms); }
.e-fall { animation: eFall 950ms cubic-bezier(.2, .7, .3, 1) backwards; animation-delay: var(--d, 0ms); }
.e-slide { animation: eSlide 360ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); }
.e-grow { animation: eGrow 620ms cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: var(--d, 0ms); transform-origin: 50% 100%; }
.e-sway { animation: eSway 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
.e-nudge { animation: eNudge 2.8s ease-in-out 1.2s infinite; }
.e-svg { transform-box: fill-box; transform-origin: 50% 50%; }
.e-press { transition: translate 120ms ease, box-shadow 160ms ease, background-color 160ms ease; }
.e-press:active { translate: 0 3px; }
.e-flip { transition: rotate 560ms cubic-bezier(.3, .7, .3, 1), translate 120ms ease; transform-style: preserve-3d; }
@media (prefers-reduced-motion: reduce) {
  .e-lay, .e-rise, .e-stamp, .e-pop, .e-fall, .e-slide, .e-grow, .e-sway, .e-nudge { animation: none !important; }
  .e-press, .e-flip { transition: none !important; }
}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F0E6CF; font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif; color: #1E1B18">

      <filter id="paperE" x="-10%" y="-10%" width="120%" height="135%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="t"></feTurbulence>

  <svg width="390" height="844" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 0">

  <div style="position: relative; z-index: 1; height: 844px; box-sizing: border-box; padding: 18px 20px 22px 20px; display: flex; flex-direction: column">

    <sc-if value="{{isChild}}" hint-placeholder-val="{{true}}">

                <g filter="url(#paperE)"><path d="M12 26 V 20 A 20 20 0 0 1 52 20 V 26 H 42 V 20 A 10 10 0 0 0 22 20 V 26 Z" fill="#4E4336"></path></g>
                <g filter="url(#paperE)"><rect x="4" y="24" width="56" height="46" rx="8" fill="#2E4A6E"></rect></g>

              </g>
            </g>
            <g transform="translate(14 28) rotate(-5)">
              <g filter="url(#paperE)"><rect width="168" height="46" rx="3" fill="#FBF6EA"></rect></g>
              <circle cx="11" cy="14" r="3" fill="#A93A27"></circle>
              <text x="20" y="19" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="700" fill="#1E1B18">Bộ xương và cơ bắp</text>
              <text x="20" y="36" font-family="'Be Vietnam Pro', sans-serif" font-size="12" font-weight="600" fill="#4E4336">Mức 3 · cần mở khoá</text>
            </g>
          </svg>
        </div>

        <div class="e-slide" style="--d: 150ms; flex-shrink: 0; filter: drop-shadow(0 3px 3px rgba(91, 59, 23, 0.3))">
          <div style="background: #FBF6EA; padding: 18px 14px 14px 16px; clip-path: polygon(0 6px, 6% 1px, 12% 5px, 19% 0, 27% 4px, 35% 1px, 43% 6px, 52% 2px, 60% 5px, 68% 0, 77% 4px, 85% 1px, 93% 5px, 100% 2px, 100% 100%, 0 100%); display: flex; align-items: center; gap: 10px">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 21px; font-weight: 700; line-height: 1.25">This topic needs a grown-up.</span>
              <span style="font-size: 15px; line-height: 1.4; color: #4E4336">Chủ đề này cần bố mẹ mở khoá.</span>
            </div>
            <button aria-label="Nghe câu này" class="e-press" style="width: 56px; height: 56px; flex-shrink: 0; padding: 0; border: none; background: transparent; cursor: pointer; line-height: 0">
              <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><g filter="url(#paperE)"><circle cx="28" cy="27" r="25" fill="#F0E6CF"></circle></g><g transform="translate(16 15)"><path d="M3 9.5h4.2L13 4.8v14.4l-5.8-4.7H3z" fill="#1E1B18"></path><path d="M16.2 8.6a4.6 4.6 0 0 1 0 6.8M18.8 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="#1E1B18" stroke-width="2.4" stroke-linecap="round"></path></g></svg>
            </button>
          </div>
        </div>

        <div style="flex: 1"></div>
        <div class="e-slide" style="--d: 220ms; flex-shrink: 0">
          <button onClick="{{toGate}}" class="e-press" style="position: relative; display: block; width: 100%; height: 66px; border: none; background: transparent; padding: 0; cursor: pointer; font-family: 'Phudu', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0.5px; color: #FBF6EA">
            <svg width="100%" height="100%" viewBox="0 0 350 66" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0"><g filter="url(#paperE)"><rect x="4" y="10" width="342" height="52" rx="10" fill="#6E2216"></rect></g><g filter="url(#paperE)"><rect x="4" y="3" width="342" height="52" rx="10" fill="#A93A27"></rect></g></svg>
            <span style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px">Gọi bố mẹ<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5h10.2l-4.1-4.1 2.1-2.1L20 12l-7.8 7.7-2.1-2.1 4.1-4.1H4z" fill="#FBF6EA"></path></svg></span>
          </button>

        <div class="e-slide" style="--d: 280ms; flex-shrink: 0">
          <a href="Discoverer-Home.dc.html" class="e-press" style="height: 56px; box-sizing: border-box; border-radius: 10px; background: #FBF6EA; box-shadow: 0 3px 4px rgba(91, 59, 23, 0.28); display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Phudu', sans-serif; font-size: 19px; font-weight: 700; color: #1E1B18">Học chủ đề miễn phí</a>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isGate}}" hint-placeholder-val="{{false}}">
      <div style="height: 804px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
        <div class="e-lay" style="flex-shrink: 0; display: flex; align-items: center">
          <button onClick="{{toChild}}" class="e-press" style="height: 48px; box-sizing: border-box; border: none; border-radius: 10px; background: transparent; cursor: pointer; padding: 0 12px 0 4px; display: flex; align-items: center; gap: 6px; font-family: 'Phudu', sans-serif; font-size: 18px; font-weight: 700; color: #1E1B18">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(24 0) scale(-1 1)"><path d="M4 10.5h10.2l-4.1-4.1 2.1-2.1L20 12l-7.8 7.7-2.1-2.1 4.1-4.1H4z" fill="#1E1B18"></path></g></svg>
            <span>Quay lại</span>
          </button>
        </div>

        <div class="e-slide" style="--d: 80ms; flex-shrink: 0; background: #FBF6EA; border-radius: 10px; box-shadow: 0 3px 4px rgba(91, 59, 23, 0.22); padding: 18px 18px 20px 18px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: flex-start; gap: 12px">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
              <span style="display: inline-block; transform: rotate(-2deg); filter: drop-shadow(0 2px 2px rgba(91, 59, 23, 0.32))"><span style="display: block; padding: 4px 10px; background: #2E4A6E; color: #FBF6EA; font-family: 'Phudu', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px)">Dành cho bố mẹ</span></span>
              <span style="font-size: 17px; font-weight: 700; line-height: 1.3">Nhập kết quả để tiếp tục</span>
            </div>
            <svg width="44" height="55" viewBox="0 0 64 80" aria-hidden="true" style="flex-shrink: 0">
              <g filter="url(#paperE)"><path d="M12 26 V 20 A 20 20 0 0 1 52 20 V 26 H 42 V 20 A 10 10 0 0 0 22 20 V 26 Z" fill="#4E4336"></path></g>
              <g filter="url(#paperE)"><rect x="4" y="24" width="56" height="46" rx="8" fill="#2E4A6E"></rect></g>
              <circle cx="32" cy="42" r="6" fill="#FBF6EA"></circle>
              <path d="M29.5 44 H 34.5 L 36 56 H 28 Z" fill="#FBF6EA"></path>
            </svg>
          </div>
          <span style="font-family: 'Phudu', sans-serif; font-size: 46px; font-weight: 900; line-height: 1.1; letter-spacing: 0.5px">12 + 15 = ?</span>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="gate-answer" style="font-size: 14px; font-weight: 600; line-height: 1.3; color: #4E4336">Kết quả</label>
            <div style="display: flex; align-items: center; gap: 14px">
              <input id="gate-answer" type="text" inputmode="numeric" autocomplete="off" value="{{answer}}" onChange="{{onAnswer}}" style="width: 150px; height: 64px; flex-shrink: 0; box-sizing: border-box; border: none; border-radius: 10px; background: #E6D9BC; box-shadow: inset 0 2px 5px rgba(91, 59, 23, 0.28); padding: 0 14px; font-family: 'Phudu', sans-serif; font-size: 30px; font-weight: 700; text-align: center; color: #1E1B18">
              <sc-if value="{{right}}" hint-placeholder-val="{{false}}">
                <span role="status" style="display: flex; align-items: center; gap: 10px">
                  <span class="e-stamp" aria-hidden="true" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 3px; background: #A93A27; transform: rotate(-8deg); box-shadow: 0 2px 3px rgba(91, 59, 23, 0.3); display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l2.4-2.4 3.9 3.9 8.3-8.3 2.4 2.4L9.8 18.8z" fill="#FBF6EA"></path></svg></span>
                  <span style="font-family: 'Phudu', sans-serif; font-size: 20px; font-weight: 900; color: #A93A27">Đúng rồi</span>
                </span>
              </sc-if>
            </div>
          </div>
        </div>

        <sc-if value="{{wrong}}" hint-placeholder-val="{{false}}">
          <div role="status" class="e-lay" style="flex-shrink: 0; filter: drop-shadow(0 3px 3px rgba(91, 59, 23, 0.28))">
            <div style="position: relative; background: #FBF6EA; padding: 12px 34px 12px 16px; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%)">
              <span aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 22px; height: 22px; background: #E2D4B4; clip-path: polygon(0 0, 0 100%, 100% 100%)"></span>
              <span style="font-family: 'Phudu', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.2">Chưa đúng, thử lại nhé.</span>
            </div>
          </div>
        </sc-if>

        <div style="flex: 1"></div>
        <div class="e-slide" style="--d: 160ms; flex-shrink: 0">
          <sc-if value="{{right}}" hint-placeholder-val="{{false}}">
            <a href="Discoverer-Signup.dc.html" class="e-press" style="position: relative; display: block; height: 66px; text-decoration: none; font-family: 'Phudu', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0.5px; color: #FBF6EA">
              <svg width="100%" height="100%" viewBox="0 0 350 66" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0"><g filter="url(#paperE)"><rect x="4" y="10" width="342" height="52" rx="10" fill="#6E2216"></rect></g><g filter="url(#paperE)"><rect x="4" y="3" width="342" height="52" rx="10" fill="#A93A27"></rect></g></svg>
              <span style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px">Xác nhận<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5h10.2l-4.1-4.1 2.1-2.1L20 12l-7.8 7.7-2.1-2.1 4.1-4.1H4z" fill="#FBF6EA"></path></svg></span>
            </a>
          </sc-if>
          <sc-if value="{{notRight}}" hint-placeholder-val="{{true}}">
            <button aria-disabled="true" class="e-press" style="position: relative; display: block; width: 100%; height: 66px; border: none; background: transparent; padding: 0; cursor: default; font-family: 'Phudu', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0.5px; color: #4E4336">

            </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'child', answer: '' };
  }
  renderVals() {
    const s = this.state;
    const a = s.answer;
    const right = a === '27';
    const wrong = a.length >= 2 && !right;
    return {
      isChild: s.step === 'child',
      isGate: s.step === 'gate',
      toGate: () => this.setState({ step: 'gate', answer: '' }),
      toChild: () => this.setState({ step: 'child', answer: '' }),
      answer: a,
      onAnswer: (e) => this.setState({ answer: String(e.target.value).replace(/[^0-9]/g, '').slice(0, 3) }),
      right,
      notRight: !right,
      wrong
    };
  }
}
</script>
